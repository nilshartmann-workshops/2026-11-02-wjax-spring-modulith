# Postgres aus der compose.yaml, gestartet mit "docker compose up -d postgres".
# Eingeschaltet wird das Profil mit einer Datei config/application.properties
# im Projektverzeichnis (steht in der .gitignore) und der Zeile
#   spring.profiles.include=postgres
# Die Tests bekommen Postgres ueber config/application-test.properties mit
#   spring.datasource.url=jdbc:tc:postgresql:18:///plantify-${random.uuid}
spring.datasource.url=jdbc:postgresql://localhost:5432/plantify
spring.datasource.username=plantify
spring.datasource.password=plantify
spring.h2.console.enabled=false
