spring.application.name=plantify
spring.mvc.problemdetails.enabled=true

# Die Datenbank waehlt ein Profil: ohne Angabe H2 als Datei, mit dem Profil
# "postgres" ein Postgres aus der compose.yaml.
spring.profiles.default=h2

# Kafka und Zipkin liegen im Classpath, laufen aber nur fuer die Vorfuehrungen.
# Ohne diese beiden Zeilen braucht der Start Docker bzw. ein laufendes Zipkin.
spring.docker.compose.enabled=false
management.tracing.export.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
springdoc.swagger-ui.enabled=true

#spring.modulith.detection-strategy=explicitly-annotated

spring.modulith.runtime.flyway-enabled=true

# 🕵️‍♂️ Zeigen: nach dem Neustart ist der FAILED-Eintrag COMPLETED
# 🕵️‍♂️ Zeigen: zweiter Knoten mit --server.port=8081, startet er, waehrend der erste die Poststelle verarbeitet, geht die Mail zweimal hinaus
# 🕵️‍♂️ Erzaehlen: im Cluster aus, erneut zugestellt wird nur FAILED ueber den Leitstand
spring.modulith.events.republish-outstanding-events-on-restart=false

# 🕵️‍♂️ Zeigen: Leitstand, die Poststelle steht erst auf PROCESSING, nach 15 bis 20 Sekunden auf FAILED, nach 30 auf COMPLETED
# 🕵️‍♂️ Fallstrick: wer erneut zustellt, solange der Listener noch laeuft, verschickt die Mail zweimal
spring.modulith.events.staleness.processing=10s
spring.modulith.events.staleness.check-interval=5s

# 🕵️‍♂️ Zeigen: docker compose up -d zipkin, add-plant.sh, dann Zipkin auf http://localhost:9411
# 🕵️‍♂️ Zeigen: ein Span je Modul, plant ruft, care, billing und mailroom hoeren zu (module.invocation-type=event-listener)
# 🕵️‍♂️ Erzaehlen: kein eigener Code, die Spans kommen von spring-modulith-starter-insight
# 🕵️‍♂️ Fallstrick: ohne laufendes Zipkin meldet der Export Verbindungsfehler im Log
management.tracing.sampling.probability=1
management.tracing.export.enabled=true

# 🕵️‍♂️ Zeigen: Zipkin, der Span-Baum reicht jetzt ueber mailroom bis zum Kafka-Producer (mail-requests send)
spring.kafka.template.observation-enabled=true

spring.modulith.events.externalization.mode=outbox
namastack.outbox.enabled=true
# Die Outbox gibt sonst nach drei Versuchen auf, und das waere vor dem Neustart des Brokers
namastack.outbox.retry.max-retries=100
# Die Wartezeit zwischen zwei Versuchen waechst sonst bis zu einer Minute, so lange wartet dann auch die Nachlieferung
namastack.outbox.retry.exponential.max-delay=10s
# Ohne Broker scheitert ein Versand sonst erst nach zwei Minuten
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=10000
# 🕵️‍♂️ Zeigen: docker stop wjax-plantify-kafka, Pflanze anlegen: 200, und der Eintrag in outbox_record bleibt NEW
# 🕵️‍♂️ Zeigen: waehrend der Broker fehlt, steigt failure_count in outbox_record, zuletzt etwa alle 20 Sekunden, und next_retry_at rueckt weiter
# 🕵️‍♂️ Zeigen: docker start wjax-plantify-kafka, der Poller liefert ohne Neustart nach, beim naechsten next_retry_at
# 🕵️‍♂️ Fallstrick: jetzt verschickt der Poller, und der Span mail-requests send haengt an dessen eigenem Trace, nicht mehr an der Pflanze
# 🕵️‍♂️ Fallstrick: der Poller der Outbox-Bibliothek schreibt alle paar Sekunden einen eigenen Trace, in Zipkin nach "post /api/plants" suchen

logging.level.com.zaxxer.hikari=WARN
logging.level.nh.demo.plantify.PlantifyApplication=WARN
logging.level.org.springframework.data=WARN
logging.level.org.springdoc.core=WARN
logging.level.org.springframework.scheduling=WARN
logging.level.org.springframework.boot.jpa=WARN
logging.level.org.springframework.web.servlet=WARN
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate.orm.connections=WARN
logging.level.org.springframework.boot.actuate=WARN
logging.level.org.hibernate.orm=WARN

logging.level.org.flywaydb.core=WARN
# Ohne Broker schreibt der Kafka-Producer sonst jede Sekunde zwei Warnungen
logging.level.org.apache.kafka.clients.NetworkClient=ERROR


logging.level.nh.demo.plantify=DEBUG

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
